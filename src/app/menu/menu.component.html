<ion-menu side="start" menuId="menu" contentId="main-content">
  <ion-header>
    <ion-toolbar class="farm-toolbar">
      <ion-title>Menu Content</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-menu-toggle auto-hide="true">
      <ion-button expand="block" routerLink="/home">Inicio</ion-button>
    </ion-menu-toggle>
    <ion-menu-toggle auto-hide="true">
      <ion-button expand="block" routerLink="/profile">Perfil</ion-button>
    </ion-menu-toggle>
    <ion-menu-toggle auto-hide="true">
      <ion-button expand="block" routerLink="/cow-list">Lista de Vacas</ion-button>
    </ion-menu-toggle>
    <ion-menu-toggle auto-hide="true">
      <ion-button expand="block" routerLink="/cow-register">Registrar Vaca</ion-button>
    </ion-menu-toggle>
    <ion-menu-toggle auto-hide="true">
      <ion-button expand="block" routerLink="/health-history">Historial de Salud</ion-button>
    </ion-menu-toggle>
    <ion-menu-toggle auto-hide="true">
      <ion-button expand="block" routerLink="/#">Ajustes</ion-button>
    </ion-menu-toggle>
    <ion-menu-toggle auto-hide="true">
      <ion-button expand="block" color="danger" (click)="logout()">Cerrar Sesión</ion-button>
    </ion-menu-toggle>
  </ion-content>
</ion-menu>
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar class="farm-toolbar">
      <ion-title>Menu</ion-title>
      <ion-buttons slot="end">
        <ion-menu-button menu="menu"></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding"> Tap the button in the toolbar to open the menu. </ion-content>
</div>
